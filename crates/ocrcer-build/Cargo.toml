[package]
name = "ocrcer-build"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "ocrcer_build"
path = "src/lib.rs"

[[bin]]
name = "ocrcer-build"
path = "src/main.rs"

[dependencies]
ocrcer-core = { path = "../ocrcer-core" }
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
